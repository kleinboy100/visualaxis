# Netlify deployment for the TanStack Start (SSR) app.
# Required environment variables in Netlify (Site settings > Environment variables):
#   VITE_SUPABASE_URL, VITE_SUPABASE_PUBLISHABLE_KEY, VITE_SUPABASE_PROJECT_ID
#   SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, SUPABASE_PROJECT_ID
#   SUPABASE_SERVICE_ROLE_KEY (admin/server actions), YOCO_SECRET_KEY, LOVABLE_API_KEY
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--legacy-peer-deps"
